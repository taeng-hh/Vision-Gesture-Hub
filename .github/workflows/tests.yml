name: Tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data-test dependency
        run: python -m pip install "numpy>=1.26,<3"
      - name: Check Python syntax
        run: python -m compileall -q main.py core modes ui training scripts tests ksl
      - name: Run unit tests without desktop dependencies
        run: python -m unittest discover -s tests -v
  training-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training dependencies
        run: |
          python -m pip install "numpy>=1.26,<3"
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Check training, holdout, save and prediction
        run: python -m unittest discover -s tests -p test_ksl_training.py -v
