name: Tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Korean font and OpenCV system library
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libgl1
      - name: Install runtime dependencies (CPU torch)
        run: python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Check Python syntax
        run: python -m compileall -q main.py sign_language_webcam.py core fusion modes ui training scripts tests ksl
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  training-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training dependencies
        run: |
          python -m pip install "numpy>=1.26,<3"
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Check training, holdout, save and prediction
        run: python -m unittest discover -s tests -p test_ksl_training.py -v
